version: "3.8"
services:
  # Sysbox-based DinD - The superior approach!
  dind:
    image: docker:dind
    runtime: sysbox-runc  # ⬅️ This is the magic of Sysbox!
    environment:
      - DOCKER_TLS_CERTDIR=  # Disable TLS for simplicity
    command:
      - --host=tcp://0.0.0.0:2375
      - --host=unix:///var/run/docker.sock
    volumes:
      - dind-lib:/var/lib/docker
    healthcheck:
      test: ["CMD", "docker", "info"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [dind-network]

  # CI Runner - Same as traditional but optimized for Sysbox
  ci-runner:
    image: alpine:3.20
    depends_on:
      dind:
        condition: service_healthy
    environment:
      - DOCKER_HOST=tcp://dind:2375
    volumes:
      - ./app:/app
      - ./ci:/ci
    working_dir: /ci
    command: ["/bin/sh","-c","apk add --no-cache docker-cli curl && chmod +x run.sh && ./run.sh"]
    networks: [dind-network]

volumes:
  dind-lib:

networks:
  dind-network:
    driver: bridge